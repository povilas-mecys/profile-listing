$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Profile listing
description: A reusable grid or list of profiles with optional portraits and introductory text.
status: stable
group: Content

props:
  type: object
  required:
    - profiles
  properties:
    title:
      title: Title
      description: Plain-text section heading, translated by the caller.
      type: string
    caption:
      title: Caption
      description: Plain-text introduction, translated by the caller.
      type: string
    layout:
      title: Layout
      type: string
      enum: [grid, list]
      default: grid
    heading_level:
      title: Heading level
      description: Section heading level. Profile headings use the next level when a title is present.
      type: integer
      enum: [2, 3, 4, 5]
      default: 2
    profiles:
      title: Profiles
      description: Ordered profile data prepared by Drupal. An empty array suppresses the component.
      type: array
      items:
        type: object
        required:
          - name
        properties:
          name:
            title: Name
            type: string
            minLength: 1
          url:
            title: Profile URL
            description: Optional safe URL generated by Drupal. Omit for an unlinked profile.
            type: string
          eyebrow:
            title: Eyebrow
            description: Plain-text discipline or category.
            type: string
          role:
            title: Role
            type: string
          focus:
            title: Research focus
            description: Plain-text subject only; the template adds the translated Research focus prefix.
            type: string
          image:
            title: Portrait
            description: Optional decorative portrait. Resolve the image style URL and dimensions in Drupal.
            type: object
            required:
              - src
            properties:
              src:
                title: Image URL
                type: string
                minLength: 1
              width:
                title: Image width
                type: integer
                minimum: 1
              height:
                title: Image height
                type: integer
                minimum: 1
